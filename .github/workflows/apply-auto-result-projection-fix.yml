name: Apply AUTO result projection fix

on:
  push:
    branches: ["fix/auto-result-projection"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-result-projection
          fetch-depth: 0
      - name: Apply bounded patch
        run: python tools/apply_auto_result_projection_fix.py
      - name: Run targeted tests
        run: python -m pytest -q tests/test_project_center_auto_result_projection.py tests/test_auto_prerequisite_graph.py
      - name: Commit fix
        shell: bash
        run: |
          git rm .github/workflows/apply-auto-result-projection-fix.yml tools/apply_auto_result_projection_fix.py
          git add bdb_vnext/project_center_auto.py tests/test_project_center_auto_result_projection.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: project execution failure projection in AUTO"
          git push origin HEAD:fix/auto-result-projection
