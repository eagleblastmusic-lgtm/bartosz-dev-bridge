name: Temporary M7c Path Import Repair

on:
  push:
    branches:
      - tmp-m7c-promotion-closure-build

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Add missing Path import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bdb_vnext/m7c_promotion_authority.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from datetime import datetime, timezone\n'
          line = 'from pathlib import Path\n'
          if line not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('unexpected M7c import anchor')
              text = text.replace(anchor, anchor + line, 1)
              path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile bdb_vnext/m7c_promotion_authority.py
          git diff --check

      - name: Commit and push repair
        shell: bash
        run: |
          git config user.name "BDB vNext CI"
          git config user.email "bdb-vnext-ci@localhost.invalid"
          git add bdb_vnext/m7c_promotion_authority.py
          git commit -m "bdb-vnext: import Path for M7c Control DB identity"
          git push origin HEAD:tmp-m7c-promotion-closure-build
