name: Temporary project launch stability patcher v2

on:
  push:
    branches:
      - fix/project-launch-stable-ack-reporting

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-launch-stable-ack-reporting
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Reuse bounded patch program from first patcher
        shell: python {0}
        run: |
          from pathlib import Path
          import subprocess
          import sys

          workflow = Path('.github/workflows/project-launch-stable-ack-patcher.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply bounded source patch and regression contracts\n'
          step = workflow.index(marker)
          run_marker = '        run: |\n'
          start = workflow.index(run_marker, step) + len(run_marker)
          end = workflow.index('\n      - name:', start)
          raw = workflow[start:end]
          lines = []
          for line in raw.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          patch_program = '\n'.join(lines) + '\n'
          patch_file = Path('/tmp/apply_project_launch_patch.py')
          patch_file.write_text(patch_program, encoding='utf-8')
          subprocess.check_call([sys.executable, str(patch_file)])

      - name: Run new regression contract
        run: python -m pytest -q tests/test_vnext_project_launch_stable_ack.py

      - name: Run existing browser admission regression
        run: python -m pytest -q tests/test_vnext_m3b_browser_admission.py

      - name: Commit bounded patch and remove temporary patchers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/project-launch-stable-ack-patcher.yml .github/workflows/project-launch-stable-ack-patcher-v2.yml
          git add browser_extension_vnext/content_adapter.js browser_extension_vnext/popup.js tests/test_vnext_project_launch_stable_ack.py .github/workflows/bdb-vnext-ci.yml
          git commit -m "fix: harden project launch insertion acknowledgement"
          git push origin HEAD:fix/project-launch-stable-ack-reporting
