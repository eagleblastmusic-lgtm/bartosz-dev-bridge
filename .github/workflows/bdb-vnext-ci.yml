name: BDB vNext CI

on:
  pull_request:
    branches: [bdb-vnext]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-vnext:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev,gui]"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0

      - name: Verify production AUTO orchestration and recovery
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          tests/test_semantic_acceptance_hardening.py
          tests/test_canonical_task_recovery.py
          tests/test_project_execution_code_evidence_retry.py
          tests/test_project_center_write_capability_regression.py
          tests/test_project_execution_integration.py
          tests/test_project_execution_submission.py
          tests/test_vnext_project_result_reliability_runtime.py
          tests/test_vnext_project_reliability_e2e.py
          tests/test_auto_delivery_native_process.py
          tests/test_nx006_launch_outbox.py
          tests/test_auto_prerequisite_graph.py
          tests/test_vnext_chatgpt_dom_delivery_recovery.py
          tests/test_vnext_project_auto_browser.py
          tests/test_project_execution_browser_recovery_e2e.py
          tests/test_vnext_project_launch_browser_bridge.py
          tests/test_m9b_project_launch_durable_ack.py
          tests/test_m9b_project_launch_legacy_ack_compat.py

      - name: Compile vNext sources
        run: python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('bdb_vnext').glob('*.py')]"

      - name: Verify Memory, GUI responsiveness, admission retention and Local Execution
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          tests/test_project_memory_persistence_contract.py
          tests/test_project_memory_live_retention.py
          tests/test_cc3_project_memory_slice3.py
          tests/test_project_workflow_responsiveness.py
          tests/test_nx030_project_center.py
          tests/test_browser_admission_retention.py
          tests/test_local_execution_remediation.py
          tests/test_nx040_local_execution_contract.py
          tests/test_nx042_execution_policy.py
          tests/test_nx043_stateless_process_runner.py
          tests/test_nx044_tool_adapters.py
          tests/test_nx045_candidate_execution_bridge.py
          tests/test_nx046_stateless_powershell.py
          tests/test_nx049_output_cancellation_redaction.py
          tests/test_nx050_same_chat_local_execution.py
          tests/test_nx066_v1_v2_shadow_migration.py
          -k "not machine_gate"

      - name: Create current source-bound retention evidence
        if: runner.os == 'Windows'
        run: python scripts/run_million_event_harness.py

      - name: Execute source-bound retention, migration and Local Execution gates on Windows
        if: runner.os == 'Windows'
        run: >-
          python -m pytest -q
          tests/test_nx018_retention_compaction.py
          tests/test_nx042_execution_policy.py
          tests/test_nx043_stateless_process_runner.py
          tests/test_nx044_tool_adapters.py
          tests/test_nx045_candidate_execution_bridge.py
          tests/test_nx046_stateless_powershell.py
          tests/test_nx049_output_cancellation_redaction.py
          tests/test_nx050_same_chat_local_execution.py
          tests/test_nx066_v1_v2_shadow_migration.py
          -k machine_gate

      - name: Validate JSON schemas
        shell: python {0}
        run: |
          import json
          from pathlib import Path
          for path in Path('schemas').glob('bdb-vnext-*.schema.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('vNext schemas parse as JSON')

      - name: Run M11a/M1b focused gate when present
        shell: python {0}
        run: |
          import subprocess
          from pathlib import Path
          tests = [
              'tests/test_vnext_bootstrap.py',
              'tests/test_m11a_bootstrap_slots.py',
              'tests/test_m11a_prepared_activation.py',
          ]
          existing = [item for item in tests if Path(item).is_file()]
          if existing:
              raise SystemExit(subprocess.call(['python', '-m', 'pytest', '-q', *existing]))

      - name: Run focused Control Store race contracts when present
        shell: python {0}
        run: |
          import subprocess
          from pathlib import Path
          tests = [
              Path('tests/test_control_seal_read_retry.py'),
              Path('tests/test_control_seal_write_retry.py'),
          ]
          existing = [str(item) for item in tests if item.is_file()]
          if existing:
              raise SystemExit(subprocess.call(['python', '-m', 'pytest', '-q', *existing]))

      - name: Run M9b/M3 portable regression gate
        run: >-
          python -m pytest -q
          tests/test_m9b_activation.py
          tests/test_m9b_native_host.py
          tests/test_m9b_browser_bundle.py
          tests/test_runtime_authority.py
          tests/test_blocked_task_retry_binding.py
          tests/test_blocked_retry_terminal_evidence.py
          tests/test_resilient_project_center_composition.py
          tests/test_vnext_m3a_submission.py
          tests/test_vnext_m3b_browser_admission.py
          tests/test_vnext_project_launch_stable_ack.py
          tests/test_vnext_project_launch_nonblocking_peek.py
          tests/test_vnext_m3c_admission.py

      - name: Explain excluded platform experiments
        shell: python {0}
        run: |
          print(
              'PASS: portable PR gate complete. '
              'Historical benchmark suites, local-path N6 engineering pilots, '
              'Browser runtime harnesses, and destructive/platform fault experiments '
              'belong to their dedicated workflows and are not universal PR blockers.'
          )
