name: Temporary M7a fixture repair

on:
  push:
    branches:
      - tmp-m7a-git-cas-build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-m7a-fixture-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-m7a-git-cas-build
          fetch-depth: 2

      - name: Apply exact mechanical test-only repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_vnext_m7a_git_cas.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '            "nested/created.txt": b"created\\n",': '            "nested/two.txt": b"checked-two\\n",',
              '        query = ctx["kernel"].query(prepared.work_id) if "kernel" in ctx else None\n        # WorkKernel claim is asserted through the canonical query in the adapter itself.\n': '',
              '        assert "checkout" not in source.lower()\n        assert "push" not in source.lower()': '        assert \'["checkout"\' not in source\n        assert \'["merge"\' not in source\n        assert \'["push"\' not in source\n        assert \'["reset"\' not in source',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
          if changed:
              path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet -- tests/test_vnext_m7a_git_cas.py; then
            echo "No repair needed."
            exit 0
          fi

          git diff --check
          git diff -- tests/test_vnext_m7a_git_cas.py
          git config user.name "BDB vNext CI"
          git config user.email "bdb-vnext-ci@users.noreply.github.com"
          git add tests/test_vnext_m7a_git_cas.py
          git commit -m "test: repair M7a exact replacement fixture"
          git push origin HEAD:tmp-m7a-git-cas-build
