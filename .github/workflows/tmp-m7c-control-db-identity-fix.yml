name: Temporary M7c Control DB Identity Repair

on:
  push:
    branches:
      - tmp-m7c-promotion-closure-build

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Repair same-Control-DB check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bdb_vnext/m7c_promotion_authority.py')
          text = path.read_text(encoding='utf-8')
          old = '''        connection = getattr(m7a_adapter, "_connection", None)\n        if connection is None:\n            _fail("m7c_dependencies_required", "M7c requires the unified vNext Control DB")\n        if validation_authority._connection is not connection or m7b_adapter._connection is not connection:\n            _fail("m7c_control_store_mismatch", "M6c/M7a/M7b must share one Control DB")\n        self.validation_authority = validation_authority\n'''
          new = '''        connection = getattr(m7a_adapter, "_connection", None)\n        if connection is None:\n            _fail("m7c_dependencies_required", "M7c requires the unified vNext Control DB")\n\n        def main_db_path(db_connection: Any) -> str:\n            rows = db_connection.execute("PRAGMA database_list").fetchall()\n            for _sequence, name, filename in rows:\n                if str(name) == "main" and str(filename):\n                    return str(Path(str(filename)).resolve())\n            _fail("m7c_control_store_mismatch", "cannot establish exact main Control DB path")\n\n        control_paths = {\n            main_db_path(connection),\n            main_db_path(validation_authority._connection),\n            main_db_path(m7b_adapter._connection),\n        }\n        if len(control_paths) != 1:\n            _fail(\n                "m7c_control_store_mismatch",\n                "M6c/M7a/M7b must use the same physical Control DB",\n                details={"control_db_paths": sorted(control_paths)},\n            )\n        self.validation_authority = validation_authority\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected M7c constructor DB anchor')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_vnext_m7c_promotion_authority.py')
          tests = test_path.read_text(encoding='utf-8')
          old_test = '''        assert ctx["m7c"]._connection is ctx["m7a"]._connection\n        assert ctx["m7c"]._connection is ctx["m6c"]._connection\n        assert ctx["m7c"]._connection is ctx["m7b"]._connection\n'''
          new_test = '''        def main_db_path(connection):\n            return next(\n                str(Path(str(row[2])).resolve())\n                for row in connection.execute("PRAGMA database_list").fetchall()\n                if str(row[1]) == "main"\n            )\n\n        assert ctx["m7c"]._connection is ctx["m7a"]._connection\n        assert {\n            main_db_path(ctx["m7c"]._connection),\n            main_db_path(ctx["m6c"]._connection),\n            main_db_path(ctx["m7b"]._connection),\n        } == {main_db_path(ctx["m7a"]._connection)}\n'''
          if tests.count(old_test) != 1:
              raise SystemExit('unexpected M7c same-DB test anchor')
          test_path.write_text(tests.replace(old_test, new_test, 1), encoding='utf-8')
          PY
          python -m py_compile bdb_vnext/m7c_promotion_authority.py tests/test_vnext_m7c_promotion_authority.py
          git diff --check

      - name: Commit and push repair
        shell: bash
        run: |
          git config user.name "BDB vNext CI"
          git config user.email "bdb-vnext-ci@localhost.invalid"
          git add bdb_vnext/m7c_promotion_authority.py tests/test_vnext_m7c_promotion_authority.py
          git commit -m "bdb-vnext: bind M7c to physical Control DB identity"
          git push origin HEAD:tmp-m7c-promotion-closure-build
