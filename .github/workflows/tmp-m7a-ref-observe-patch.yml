name: Temporary M7a ref observation repair

on:
  push:
    branches:
      - tmp-m7a-git-cas-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-m7a-git-cas-build
          fetch-depth: 2

      - name: Replace return-code-dependent ref observation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bdb_vnext/m7a_git_cas.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def _observe_ref(self, repository: RepositoryResource, target_ref: str) -> str | None:\n        completed = self._git(\n            repository.root,\n            ["show-ref", "--verify", "--hash", target_ref],\n            check=False,\n            operation="ref observation",\n        )\n        if completed.returncode == 1:\n            return None\n        if completed.returncode != 0:\n            _fail(\n                "git_ref_observation_failed",\n                "Git ref could not be observed exactly",\n                details={"returncode": completed.returncode},\n            )\n        raw = completed.stdout.decode("ascii", errors="strict").strip().lower()\n        return _oid(raw, object_format=repository.object_format, field="observed_ref_oid")\n'''
          new = '''    def _observe_ref(self, repository: RepositoryResource, target_ref: str) -> str | None:\n        # ``show-ref --verify --hash`` uses different non-zero statuses for an\n        # absent ref across supported Git versions.  ``for-each-ref`` gives a\n        # stable zero-result representation and also lets us require the exact\n        # full ref name instead of inferring absence from an exit code.\n        completed = self._git(\n            repository.root,\n            ["for-each-ref", "--format=%(refname)\\t%(objectname)", target_ref],\n            operation="ref observation",\n        )\n        observed: str | None = None\n        for raw_line in completed.stdout.splitlines():\n            ref_bytes, separator, oid_bytes = raw_line.partition(b"\\t")\n            if not separator:\n                _fail("git_ref_observation_failed", "Git ref observation output is malformed")\n            ref_name = ref_bytes.decode("utf-8", errors="strict")\n            if ref_name != target_ref:\n                continue\n            if observed is not None:\n                _fail("git_ref_observation_failed", "Git returned duplicate exact ref observations")\n            observed = _oid(\n                oid_bytes.decode("ascii", errors="strict").strip().lower(),\n                object_format=repository.object_format,\n                field="observed_ref_oid",\n            )\n        return observed\n'''
          if old not in text:
              raise SystemExit('exact old _observe_ref block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git diff -- bdb_vnext/m7a_git_cas.py
          git config user.name "BDB vNext CI"
          git config user.email "bdb-vnext-ci@users.noreply.github.com"
          git add bdb_vnext/m7a_git_cas.py
          git commit -m "fix: make M7a absent-ref observation version-stable"
          git push origin HEAD:tmp-m7a-git-cas-build
